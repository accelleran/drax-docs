[global]
use_syslog		0
verbose			1
logging_level		6
ts2phc.pulsewidth	100000000
ts2phc.nmea_serialport	/dev/gnss0
leapfile		/usr/share/zoneinfo/leap-seconds.list

[enp1s0f0]
ts2phc.extts_polarity	rising     
#Sets the polarity of the external timestamp signal to rising. This means the synchronization signal is triggered on the rising edge of the pulse.

ts2phc.extts_correction 0          
#Specifies any correction to be applied to the external timestamp. A value of 0 means no correction.