[global]
#
# G.8275.1
dataset_comparison		G.8275.x
G.8275.defaultDS.localPriority	128

#
domainNumber 24
clockClass 6
#    Clock Class 6: Locked with Primary Reference Clock
#    Clock Class 7: PRC unlocked but still in spec
#    Clock Class 13: Locked to app specific timescale
#    Clock Class 14: Unlocked from app specific time, but in spec
#    Clock Class 52, 187: Primary Reference Clock, unlocked and  out of spec
#    Clock Class 52, 193: Application specific unlocked and out of spec
#    Clock Class 248:  Default, if nothing else applies
#    Clock Class 255: Slave Only Clock

clockAccuracy 0x27
# nanoSecond25(32),    -- 0x20
# nanoSecond100(33),   -- 0x21
# nanoSecond250(34),   -- 0x22
# microSec1(35),       -- 0x23
# microSec2dot5(36),   -- 0x24
# microSec10(37),      -- 0x25
# microSec25(38),      -- 0x26
# microSec100(39),     -- 0x27
# microSec250(40),     -- 0x28
# milliSec1(41),       -- 0x29
# milliSec2dot5(42),   -- 0x2A
# milliSec10(43),      -- 0x2B
# milliSec25(44),      -- 0x2C
# milliSec100(45),     -- 0x2D
# milliSec250(46),     -- 0x2E
# second1(47),         -- 0x2F
# second10(48),        -- 0x30
# secondGreater10(49), -- 0x31
# unknown(254)         -- 0xFE

#
# Port Data Set
#
logAnnounceInterval -3
logSyncInterval -4
logMinDelayReqInterval -4

#
# Default interface options
#
clock_type BC
# Specifies the kind of PTP clock. Valid values are "OC" for ordinary clock, "BC" for boundary clock, "P2P_TC" for peer to peer transparent clock, and "E2E_TC" for end to end transparent clock. An multi-port ordinary clock will automatically be configured as a boundary clock. The default is "OC".
network_transport L2

#
# Clock description
#
timeSource 0x40  
#(0x10) ATOMIC_CLOCK, (0x20) GPS,(0x30) TERRESTRIAL_RADIO, (0x40) PTP, (0x50) NTP,  (0x60) HAND_SET,(0x90) OTHER, (0xA0) INTERNAL_OSCILLATOR

#
# Servo Options
#

clock_servo pi           
# The servo which is used to synchronize the local clock. Valid values are "pi" for a PI controller, "linreg" for an adaptive controller using linear regression, "ntpshm" for the NTP SHM reference clock to allow another process to synchronize the local clock (the SHM segment number is set to the domain number), and "nullf" for a servo that always dials frequency offset zero (for use in SyncE nodes). The default is "pi."
