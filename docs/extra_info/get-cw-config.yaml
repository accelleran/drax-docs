apiVersion: v1
kind: Secret
metadata:
  name: get-cw-config-netconf-authentication
  labels:
    app.kubernetes.io/name: netconf
    app.kubernetes.io/instance: get-cw-config
    app.kubernetes.io/version: 0.2.0
type: kubernetes.io/basic-auth
stringData:
  password: accelleran
  username: accelleran
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: get-cw-config-netconf-rpcs
  labels:
    app.kubernetes.io/name: netconf
    app.kubernetes.io/instance: get-cw-config
    app.kubernetes.io/version: 0.2.0
data:
  get-config-0.xml: |
    <cw-install xmlns="http://accelleran.com/ns/yang/accelleran-cw-install" xmlns:xc="urn:ietf:params:xml:ns:netconf:base:1.0"/>
  get-config-1.xml: |
    <cw-internal xmlns="http://accelleran.com/ns/yang/accelleran-cw-internal" xmlns:xc="urn:ietf:params:xml:ns:netconf:base:1.0"/>
  get-config-2.xml: |
    <cw-ran xmlns="http://accelleran.com/ns/yang/accelleran-cw-ran" xmlns:xc="urn:ietf:params:xml:ns:netconf:base:1.0"/>
  get-config-3.xml: |-
    <configuration xmlns="http://accelleran.com/ns/yang/accelleran-cw-config" xmlns:xc="urn:ietf:params:xml:ns:netconf:base:1.0"/>
---
apiVersion: batch/v1
kind: Job
metadata:
  name: get-cw-config-netconf
  labels:
    app.kubernetes.io/name: netconf
    app.kubernetes.io/instance: get-cw-config
    app.kubernetes.io/version: 0.2.0
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netconf
        app.kubernetes.io/instance: get-cw-config
        app.kubernetes.io/version: 0.2.0
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: accelleran-secret
      initContainers:
      -
        name: wait-for-netconf
        image: accelleran/acc-generic-img:0.8.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        args:
        - -c
        - |-
          backoff=5

          rc=1
          i=0
          while [ "$rc" = 1 ] && [ "$i" -lt 5 ] ; do
            echo "Checking if netconf is ready"
            nc -z netconf-cw 8300 2>/dev/null \
            && rc=0

            i=$((i+1))

            if [ "$rc" = 1 ] && [ "$i" -lt 5 ] ; then
              echo "Netconf is not ready - backing off for $backoff seconds"
              sleep $backoff
              backoff=$(( 2 * backoff ))
            fi
          done

          if [ $rc = 0 ] ; then
            echo "Netconf is ready!"
          else
            echo "Netconf is not ready - failed"
          fi

          exit $rc
        resources: {}
      containers:
      -
        name: netconf-get-config
        image: accelleran/ncclient:0.2.0
        imagePullPolicy: IfNotPresent
        args:
        - --host
        - netconf-cw
        - --port
        - "8300"
        - --user
        - $(username)
        - --pass
        - $(password)
        - --get-config
        - /rpcs/get-config-0.xml
        - --get-config
        - /rpcs/get-config-1.xml
        - --get-config
        - /rpcs/get-config-2.xml
        - --get-config
        - /rpcs/get-config-3.xml
        envFrom:
        - secretRef:
            name: get-cw-config-netconf-authentication
        resources: {}
        volumeMounts:
        - mountPath: /rpcs
          name: get-cw-config-netconf-rpcs
      securityContext: {}
      volumes:
      - configMap:
          defaultMode: 511
          name: get-cw-config-netconf-rpcs
        name: get-cw-config-netconf-rpcs
